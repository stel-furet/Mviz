<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Test - UMD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            overflow: hidden;
        }
        #nebula-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="debug">Testing UMD version...</div>
    <div id="nebula-container"></div>
    
    <script>
        // Since the CJS version might not work directly in browser, let's try a different approach
        // Let's manually create the Nebula functionality based on what we see in the source
        
        console.log('Creating manual Nebula implementation...');
        
        const DEFAULT_CONFIG = {
            starsCount: 400,
            starsColor: "#FFFFFF",
            starsRotationSpeed: 3,
            cometFrequence: 15,
            nebulasIntensity: 10,
            bgColor: "rgb(8,8,8)",
            sunScale: 1,
            planetsScale: 1,
            solarSystemOrbite: 65,
            solarSystemSpeedOrbit: 100
        };
        
        function createSimpleNebula(element, config) {
            const finalConfig = Object.assign({}, DEFAULT_CONFIG, config);
            
            // Create background canvas
            const bgCanvas = document.createElement('canvas');
            bgCanvas.style.cssText = 'width: 100%;height: 100%;position:absolute;top: 0;left:0;';
            bgCanvas.width = element.offsetWidth / 3;
            bgCanvas.height = element.offsetHeight / 3;
            
            // Create main canvas
            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'width: 100%;height: 100%;position:absolute;top: 0;left:0;';
            canvas.width = element.offsetWidth * 2;
            canvas.height = element.offsetHeight * 2;
            
            element.appendChild(bgCanvas);
            element.appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            const bgCtx = bgCanvas.getContext('2d');
            
            // Draw background
            bgCtx.fillStyle = finalConfig.bgColor;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // Create stars
            const stars = [];
            for (let i = 0; i < finalConfig.starsCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 0.5,
                    angle: Math.random() * Math.PI * 2,
                    speed: (Math.random() - 0.5) * finalConfig.starsRotationSpeed * 0.01,
                    centerX: canvas.width / 2,
                    centerY: canvas.height / 2,
                    distance: Math.random() * Math.min(canvas.width, canvas.height) * 0.4
                });
            }
            
            function animate() {
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw stars
                ctx.fillStyle = finalConfig.starsColor;
                stars.forEach(star => {
                    star.angle += star.speed;
                    star.x = star.centerX + Math.cos(star.angle) * star.distance;
                    star.y = star.centerY + Math.sin(star.angle) * star.distance;
                    
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
            
            document.getElementById('debug').textContent = `Simple nebula created with ${finalConfig.starsCount} stars`;
            
            return {
                destroy: () => {
                    element.removeChild(bgCanvas);
                    element.removeChild(canvas);
                }
            };
        }
        
        // Test our simple implementation
        const container = document.getElementById('nebula-container');
        const nebula = createSimpleNebula(container, {
            starsCount: 200,
            starsRotationSpeed: 2,
            starsColor: '#ffffff'
        });
        
        console.log('Simple nebula created');
    </script>
</body>
</html>
